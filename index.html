<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101820">
<title>Döngü — Bir gün, yeniden</title>
<style>
:root{color-scheme:dark;--ink:#f2eee2;--muted:#a8b5b7;--gold:#e6bd77;--teal:#7ac4b2;--panel:rgba(15,25,31,.94);--line:rgba(231,220,192,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b141a;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}body{display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at 50% 20%,#26363a 0,#101a20 55%,#090f14 100%)}
#game{width:min(100vw,520px);height:100dvh;max-height:1000px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);position:relative;overflow:hidden;background:linear-gradient(180deg,#17252b,#0d171d 72%);box-shadow:0 0 70px #0009}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 5px;flex-shrink:0}.brand{font-family:Georgia,serif;font-size:23px;letter-spacing:5px;color:#f2e7cb}.brand small{display:block;font:9px system-ui;letter-spacing:2px;color:#91aaa9;margin-top:1px}.hud{display:flex;align-items:center;gap:7px}.pill{border:1px solid var(--line);border-radius:20px;padding:7px 10px;background:#142329c9;font-size:11px;color:#d9e1d8;white-space:nowrap}.pill strong{color:var(--gold);font-variant-numeric:tabular-nums;font-size:13px}
#sceneFrame{position:relative;flex:1;min-height:210px;max-height:53vh;border-radius:18px;overflow:hidden;border:1px solid #d5c5983b;background:#18262a;box-shadow:0 14px 40px #0007}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.scene-shade{pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,#10182020 0%,transparent 35%,#0a111c55 100%)}#sceneTag{position:absolute;left:13px;top:12px;padding:6px 9px;border-radius:12px;background:#101a20b8;font-size:10px;letter-spacing:1px;color:#e3ddcb;text-transform:uppercase;pointer-events:none}
#story{flex:0 0 auto;min-height:112px;margin:10px 0 8px;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:0 8px 26px #0004;display:flex;flex-direction:column;justify-content:center;gap:5px}.speaker{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}#message{font-size:13px;line-height:1.48;color:#e3e7df;min-height:39px}.hint{font-size:10px;color:#91a5a4}
#actionRow{display:flex;gap:7px;overflow-x:auto;min-height:43px;max-height:52px;padding:0 1px 5px;scrollbar-width:none;flex-shrink:0}#actionRow::-webkit-scrollbar{display:none}.action{flex:0 0 auto;border:1px solid #5b807d;background:#19302f;color:#e1eee4;border-radius:12px;padding:8px 12px;font:600 11px system-ui;white-space:nowrap;box-shadow:inset 0 1px #ffffff12}.action:active,.action.active{background:#315c53;border-color:#94c8ab;transform:translateY(1px)}.action.gold{background:#423a2b;border-color:#a88b52;color:#f2dda9}
#controls{height:104px;display:flex;align-items:center;justify-content:space-between;padding:2px 6px 7px;flex-shrink:0}.pad{width:112px;height:92px;position:relative;touch-action:none}.pad button{position:absolute;width:37px;height:35px;border:1px solid #718a85a8;border-radius:11px;background:#273a3bd9;color:#eff3e8;font-size:18px;box-shadow:0 3px 8px #0005}.pad .up{left:37px;top:0}.pad .down{left:37px;bottom:0}.pad .left{left:0;top:29px}.pad .right{right:0;top:29px}.pad .center{left:37px;top:29px;width:37px;height:35px;font-size:10px;color:#9eb4ab;background:#1a2a2b}
.control-note{font-size:9px;line-height:1.4;text-align:center;color:#8da19f;max-width:85px}.interact{width:79px;height:70px;border-radius:24px;border:1px solid #bd9e5d;background:linear-gradient(145deg,#665333,#332d25);color:#f5e1b5;font-weight:700;font-size:11px;box-shadow:0 6px 18px #0006}.interact span{display:block;font-size:22px;margin-bottom:1px}.footer{height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;font-size:9px;color:#6f8584;padding:0 4px 3px}.link{border:0;background:none;color:#91b7aa;font-size:10px;padding:5px}
#overlay{position:absolute;inset:0;background:#091116d9;display:none;align-items:center;justify-content:center;padding:24px;z-index:4;backdrop-filter:blur(4px)}.card{width:100%;max-width:380px;background:#17262a;border:1px solid #b49b644f;border-radius:20px;padding:25px 22px;box-shadow:0 20px 70px #0009}.card h1{font:30px Georgia,serif;color:#f1dfb8;margin:0 0 10px;letter-spacing:2px}.card p{font-size:13px;line-height:1.6;color:#d5dfd9}.card .choices{display:grid;gap:8px;margin-top:18px}.card button{border:1px solid #6c8c7d;background:#203d39;color:#edf4e9;border-radius:12px;padding:12px;font-weight:650;font-size:12px}.card button.secondary{background:#263034;border-color:#647171}.memories{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.memory{font-size:10px;padding:6px 9px;border-radius:10px;background:#293b37;color:#cce1c5;border:1px solid #52756866}
@media (max-height:700px){header{height:50px}#sceneFrame{max-height:48vh;min-height:185px}#story{min-height:95px;margin:7px 0}#controls{height:91px}.pad{transform:scale(.88);transform-origin:left center}.interact{height:62px}}
</style>
</head>
<body><main id="game">
<header><div class="brand">DÖNGÜ<small>BİR GÜN, YENİDEN</small></div><div class="hud"><div class="pill">GÜN <strong id="loop">01</strong></div><div class="pill"><strong id="clock">07:00</strong></div><button class="link" id="journalBtn">İPUÇLARI</button></div></header>
<div id="sceneFrame"><canvas id="world"></canvas><div class="scene-shade"></div><div id="sceneTag">Yatak Odası · 07:00</div></div>
<section id="story"><div class="speaker" id="speaker">Kuzey</div><div id="message">Alarmın yumuşak sesiyle gözlerimi açıyorum. Dışarıda sis, odada tanıdık bir sessizlik var.</div><div class="hint" id="hint">Nesnelere yaklaş ve etkileşim tuşuna dokun.</div></section>
<div id="actionRow"></div>
<div id="controls"><div class="pad" aria-label="Hareket yönleri"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="center" tabindex="-1">•</button><button class="right" data-dir="right">→</button><button class="down" data-dir="down">↓</button></div><div class="control-note">Tek elle rahatça<br>yön ver</div><button class="interact" id="interact"><span>✦</span>ETKİLEŞ</button></div>
<div class="footer"><span>İlerleme ve anılar her döngüde seninle.</span><button class="link" id="restartBtn">YENİDEN BAŞLA</button></div>
<div id="overlay"><div class="card" id="card"></div></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),msg=document.querySelector('#message'),speaker=document.querySelector('#speaker'),hint=document.querySelector('#hint'),clockEl=document.querySelector('#clock'),loopEl=document.querySelector('#loop'),tag=document.querySelector('#sceneTag'),actions=document.querySelector('#actionRow'),overlay=document.querySelector('#overlay'),card=document.querySelector('#card');
const names={room:'Yatak Odası',hall:'Apartman Koridoru',street:'Sisli Cadde',park:'Şehir Parkı',metro:'Metro İstasyonu',lab:'Terk Edilmiş Laboratuvar',core:'Kuantum Çekirdeği'};
let state={scene:'room',time:420,loop:1,x:.5,y:.68,mem:new Set(),flags:new Set(),steps:0,run:[],ending:false};
let scenePulse=0;
function say(text,who='Kuzey',tip=''){speaker.textContent=who;msg.textContent=text;hint.textContent=tip||'Yakındaki nesneyi seç veya etkileşim tuşuna dokun.'}
function has(k){return state.mem.has(k)}function flag(k){return state.flags.has(k)}function addMem(k){state.mem.add(k);save()}
function save(){try{localStorage.setItem('dongu-save',JSON.stringify({loop:state.loop,mem:[...state.mem],flags:[...state.flags],time:state.time,scene:state.scene}))}catch{}}
function setTime(mins){state.time=Math.min(1439,Math.max(420,mins));clockEl.textContent=`${String(Math.floor(state.time/60)%24).padStart(2,'0')}:${String(state.time%60).padStart(2,'0')}`;tag.textContent=`${names[state.scene]} · ${clockEl.textContent}`;if(state.time>=1439&&state.scene!=='core'&&!state.ending)resetLoop('Gece yarısına yaklaşırken çevrendeki ışıklar yumuşakça birbirine karışıyor. Sabah, tanıdık alarm sesiyle yeniden başlıyor.','gece');save()}
function spend(n=8){setTime(state.time+n)}
function enter(scene){state.scene=scene;state.x=.5;state.y=.73;tag.textContent=`${names[scene]} · ${clockEl.textContent}`;renderActions();draw();save()}
function resetLoop(text,why){state.loop++;state.flags.clear();state.run=[];state.time=420;state.scene='room';state.x=.5;state.y=.68;clockEl.textContent='07:00';tag.textContent=`${names.room} · 07:00`;loopEl.textContent=String(state.loop).padStart(2,'0');state.ending=false;say(text,'Kuzey','Anılar yanında kaldı. Yeni gün, yeni bir seçim.');renderActions();draw();save();if(why==='accident')addMem('Kaza saati');}
function action(label,fn,cls=''){let b=document.createElement('button');b.className='action '+cls;b.textContent=label;b.onclick=fn;actions.appendChild(b)}
function renderActions(){actions.innerHTML='';const s=state.scene;
if(s==='room'){if(!flag('alarm'))action('⏰ Alarmı sustur',()=>{state.flags.add('alarm');spend(2);say('Saat 07:00. Bugün sıradan bir gün gibi görünüyor. Dışarıdaki sis, pencerenin ardında ağır ağır ilerliyor.');renderActions()},'gold');if(!flag('coffee'))action('☕ Kahve hazırla',()=>{state.flags.add('coffee');spend(12);say('Kahvenin kokusu odayı dolduruyor. Masadaki notta günün planı yazılı: park, metro, eve dönüş.');addMem('Günlük plan');state.run.push('kahve');renderActions()});if(!flag('book'))action('📖 Masadaki kitabı incele',()=>{state.flags.add('book');addMem('Ela’nın kitabı: Kıyıdaki Saat');spend(5);say('Kitabın kapağında “Kıyıdaki Saat” yazıyor. Birinin altını çizdiği satırda aynı günün tekrarından söz ediliyor.');renderActions()});if(flag('alarm'))action('🚪 Apartmana çık',()=>{spend(5);enter('hall');say('Koridorda ev sahibinin kapısı aralık. Sabah ışığı duvarlara vuruyor.');},'gold')}
if(s==='hall'){action('Ev sahibiyle konuş',()=>{spend(5);say('“Günaydın Kuzey. Sis öğlene doğru açılır, ana caddeden yürümek en kolayı.” Ev sahibi gülümseyerek kapısını kapatıyor.');state.run.push('ev sahibi')});action('Apartmandan ayrıl',()=>{spend(8);enter('street');say('Sokağın sesi sisin içinden geliyor. Saat 11:30’a yaklaşırken yaya geçidinde kalabalık artıyor.');setTime(700);},'gold')}
if(s==='street'){if(state.loop===1&&!has('Kaza saati'))action('Yaya geçidine ilerle',()=>{setTime(705);say('Saat 11:45. Siyah bir araç sisin içinden geçiyor. Görüntü yumuşakça kararıyor; alarm yeniden çalıyor.','Anı','Bu an hafızana işlendi.');setTimeout(()=>resetLoop('Saat 07:00. Aynı oda, aynı alarm. Bu kez yaya geçidindeki anı da seninle.','accident'),1400)},'gold');else{action('Yan sokağa yönel',()=>{if(!has('Kaza saati'))addMem('Kaza saati');state.flags.add('safeRoute');state.run.push('yan sokak');state.run.push('anahtar');spend(10);say('Yan sokak daha sakin. Kalabalığın telaşla uzaklaştığı yerde küçük, pirinç bir anahtar buluyorsun.');addMem('Pirinç anahtar');},'gold');action('Düşen anahtarı al',()=>{if(!has('Pirinç anahtar')){addMem('Pirinç anahtar');say('Kenar taşının yanında küçük bir pirinç anahtar parlıyor.');state.run.push('anahtar');spend(3)}else say('Anahtar cebinde. Bir sonraki durağın şehir parkı.');});action('Şehir parkına git',()=>{spend(15);enter('park');say(has('Kaza saati')?'Yaya geçidinden güvenle geçiyorsun. Parkın sisli yollarında tanıdık bir yüz seni bekliyor.':'Parkın girişinde bankta birini görüyorsun.');},'gold')}}
if(s==='park'){action('Banktaki kitabı oku',()=>{if(!has('Ela’nın kitabı: Kıyıdaki Saat'))addMem('Ela’nın kitabı: Kıyıdaki Saat');state.run.push('kitap');spend(7);say('Bankta bırakılan kitabın adı “Kıyıdaki Saat”. Sayfaların arasında metro saatlerini gösteren küçük bir not var.');addMem('Metro geçiş saati');});action('Ela ile konuş',()=>{spend(6);if(has('Ela’nın kitabı: Kıyıdaki Saat')){say('“Bu kitabı tanıyorsun,” diyor Ela. “Ben de bu günü daha önce yaşamış gibiyim. Şehir dışındaki laboratuvarın kartı sende kalsın.”');addMem('Laboratuvar kartı');state.run.push('Ela ile güven');}else{say('“Bugün tanıdık geliyor,” diyor Ela. “Belki kitaplar insana doğru soruları hatırlatır.”');addMem('Ela’nın izi');} });action('Metroya ilerle',()=>{spend(12);enter('metro');say('Peron serin ve sakindir. Tren yaklaşırken zemindeki ince ışıklar ritim tutuyor.');},'gold');}
if(s==='metro'){action('Peron saatini eşleştir',()=>{if(!has('Metro geçiş saati'))addMem('Metro geçiş saati');state.run.push('metro saati');spend(4);say('Peron saatinin notunu alıyorsun. Tren 18:20’de tünelden geçecek; titreşim ritmini laboratuvarda kullanabilirsin.');addMem('Titreşim ritmi');});action('Treni 18:20’de bekle',()=>{if(state.time<1100){setTime(1100);say('Saat 18:20. Tren tünelden geçerken rayların titreşimi belirginleşiyor.');}else say('18:20 treni bugün geçti. Bu ritmi bir sonraki döngüde yakalayabilirsin.');},'gold');action('Terk edilmiş laboratuvara git',()=>{if(has('Laboratuvar kartı')){spend(18);enter('lab');say('Kart okuyucu yeşil yanıyor. Kapının ardında uzun süredir kapalı duran bir tesis uzanıyor.');}else say('Şehir dışındaki tesise ulaşmak için Ela’nın giriş kartı gerekiyor. Parka dönüp onunla konuşabilirsin.');},'gold');action('Park yoluna dön',()=>{enter('park');spend(5)});}
if(s==='lab'){action('Terminal A · 18:20',()=>{if(state.run.includes('metro saati')&&Math.abs(state.time-1100)<=40){state.flags.add('terminalA');state.run.push('terminal A');spend(6);say('Metro titreşimiyle terminal eşleşti. İlk güç halkası yandı.');addMem('Güç halkası 1');}else say('Terminal, doğru ritmi bekliyor. Peronda saati eşleştirip 18:20 trenini yakala; laboratuvara gecikmeden dön.');});action('Şehir ışıklarını bekle · 20:10',()=>{if(state.time<1210){setTime(1210);say('Saat 20:10. Şehir ışıkları birbiri ardına yanıyor; ikinci terminalin ritmi hazır.');}else say('20:10 ışık dizisi geçti. Bu eşleşmeyi bir sonraki döngüde deneyebilirsin.');});action('Terminal B · 20:10',()=>{if(state.flags.has('terminalA')&&Math.abs(state.time-1210)<=15){state.flags.add('terminalB');state.run.push('terminal B');spend(8);say('İkinci terminal, şehir ışıklarının düzeniyle uyumlandı. Bir alt kata inen kapı açıldı.');addMem('Güç halkası 2');}else say('Önce Terminal A’yı eşleştir, ardından saat 20:10’daki şehir ışıklarını yakala.');});action('Kuantum çekirdeğine in',()=>{if(state.flags.has('terminalA')&&state.flags.has('terminalB')){spend(8);enter('core');say('En alt katta devasa çekirdek ağır ağır dönüyor. Ekranda 24 saatlik bir döngü şeması var.');}else say('Çekirdeğin kapısı kapalı. Önce iki güç terminalini de eşleştir.');},'gold');action('Metroya dön',()=>{enter('metro')});}
if(s==='core'){action('Çekirdeğin kayıtlarını incele',()=>{addMem('Çekirdek gerçeği');state.flags.add('truth');state.run.push('çekirdek kaydı');spend(4);say('Çekirdek, şehrin gerçekliğini korumak için her sabahı yeniden kuruyor. Ela’nın varlığı bu dengeye bağlı.');});action('Dokuz izi gözden geçir',()=>{const order=['kahve','ev sahibi','yan sokak','anahtar','kitap','Ela ile güven','terminal A','terminal B','çekirdek kaydı'];const count=order.filter(x=>state.run.includes(x)).length;let clean=order.every(x=>state.run.includes(x))&&state.time<1439;if(clean){state.flags.add('perfect');say('Gün boyunca attığın dokuz iz bir bütün oluşturuyor. Çekirdek artık üç farklı yolu da gösterebilir.');}else say(`Günlüğünde ${count}/9 önemli iz var. Eksik adımları tamamla; anıların sonraki döngüde de yanında kalır.`);});action('Döngüyü koru',()=>ending('accept'),'gold');action('Çekirdeği kapat',()=>{if(state.flags.has('perfect')&&state.time>=1438)ending('wake');else say('Kapatma anı için tüm izler tamamlanmalı ve saat 23:59 olmalı. Çekirdek kayıtlarını ve günlüğünü tamamla.');},'gold');action('Bilincini çekirdeğe yükle',()=>{if(state.flags.has('perfect'))ending('guardian');else say('Bu seçim için günün yedi izini tamamla.');});action('Saat 23:59’a ilerle',()=>{setTime(1438);say('Dijital saat 23:58’i gösteriyor. Çekirdeğin ritmi yavaşlıyor. Son karar için bir anın var.');},'gold');}
}
function ending(kind){state.ending=true;overlay.style.display='flex';let title,text;if(kind==='accept'){title='Döngünün Kabulleni';text='Kuzey, şehrin ve Ela’nın bu ritimle var olduğunu anlıyor. Çekirdeği olduğu gibi bırakıyor. Evine döner, yatağına uzanır. Saat 23:59 olur; yeni sabaha gülümseyerek uyanır. Sonsuz keşif modu açıldı.'}else if(kind==='wake'){title='Gerçek Dünyaya Dönüş';text='Kuzey çekirdeği tam vaktinde kapatıyor. Piksel odasının görüntüsü usulca çözülüyor. Gerçek bir hastane odasında gözlerini açıyor. Doktor gülümseyerek, “Beş yıllık derin uykudan uyandın, geçmiş olsun,” diyor.'}else{title='Zamanın Gardiyanı';text='Kuzey bilincini çekirdeğe emanet ediyor. Şehrin ritmi yumuşakça dengelenirken, penceresinin dışında yeni uyanan kendisini izliyor. Artık her sabahın koruyucusu.'}card.innerHTML=`<h1>${title}</h1><p>${text}</p><div class="choices"><button onclick="window.donguContinue()">Yeni sabaha uyan</button><button class="secondary" onclick="window.donguClose()">Bu anı sakla</button></div>`;}
window.donguContinue=()=>{overlay.style.display='none';state.mem.add('Son: tamamlandı');resetLoop('Yeni bir sabah başlıyor. Önceki günün tüm bilgileri yanında.','')};window.donguClose=()=>{overlay.style.display='none';say('Bu an günlüğüne işlendi. Şehir sakin bir ritimle devam ediyor.');renderActions()};
function openJournal(){overlay.style.display='flex';let memories=[...state.mem];card.innerHTML=`<h1>Hafıza Defteri</h1><p>Her yeni döngüde bilgiler ve açılan ipuçları seninle kalır. Bugün ${clockEl.textContent}.</p><div class="memories">${memories.length?memories.map(m=>`<span class="memory">✦ ${m}</span>`).join(''):'<span class="memory">Henüz bir ipucu yok</span>'}</div><div class="choices"><button class="secondary" onclick="window.donguClose()">Günlüğe dön</button></div>`}
document.querySelector('#journalBtn').onclick=openJournal;
document.querySelector('#restartBtn').onclick=()=>{if(confirm('Yeni bir döngüye başlansın mı? Birikmiş anıların korunur.'))resetLoop('Alarmın sesiyle gözlerini açıyorsun. Bu kez yanında önceki günlerin bilgileri var.','manual')};
document.querySelector('#interact').onclick=()=>{let first=actions.querySelector('.action');if(first)first.click();else say('Şu an etkileşime açık bir nesne yok.')};
const dirBtns=[...document.querySelectorAll('[data-dir]')];let moving=null;dirBtns.forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);moving=b.dataset.dir});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>moving=null))});
let swipe=null;canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();swipe={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,rect:r};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!swipe)return;const dx=e.clientX-swipe.lastX,dy=e.clientY-swipe.lastY;if(Math.abs(dx)+Math.abs(dy)>2){state.x=Math.max(.08,Math.min(.92,state.x+dx/swipe.rect.width));state.y=Math.max(.16,Math.min(.9,state.y+dy/swipe.rect.height));draw()}swipe.lastX=e.clientX;swipe.lastY=e.clientY});canvas.addEventListener('pointerup',()=>swipe=null);canvas.addEventListener('pointercancel',()=>swipe=null);
function tick(){if(moving){let v=.007;if(moving==='up')state.y-=v;if(moving==='down')state.y+=v;if(moving==='left')state.x-=v;if(moving==='right')state.x+=v;state.x=Math.max(.08,Math.min(.92,state.x));state.y=Math.max(.16,Math.min(.9,state.y));draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(r.width*d);canvas.height=Math.floor(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()};window.addEventListener('resize',resize);
